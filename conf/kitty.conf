# vim:fileencoding=utf-8:foldmethod=marker

# misc
scrollback_lines    99999
focus_follows_mouse yes
enabled_layouts     Tall

# window size
initial_window_width  160c
initial_window_height 46c
remember_window_size  no

# fonts
font_family family="Fira Code"
font_size   10

# cursor
cursor_shape           beam
cursor_shape_unfocused hollow

# colors
background #262626
foreground #e6e6e6
cursor     #e6e6e6

# tabs
active_tab_background   #3d3846
inactive_tab_background #77767b
tab_bar_edge            top
tab_bar_style           powerline
tab_bar_min_tabs        1

# normal colors (0-7)
color0  #262626
color1  #d9392b
color2  #51d936
color3  #e69017
color4  #1567d9
color5  #576dd9
color6  #20bad9
color7  #cccccc

# bright colors (8-15)
color8  #333333
color9  #f33524
color10 #5bf33c
color11 #e69e39
color12 #1873f3
color13 #6179f3
color14 #24d1f3
color15 #d9d9d9
